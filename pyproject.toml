    { name = "ailearner415", email = "ailearner415@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "certifi>=2026.7.22",
    "chardet>=7.7.0",
    "idna>=3.18",
    "inflection>=0.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "more-itertools>=11.2.1",
    "notebook>=7.6.1",
    "numpy>=2.5.1",
    "openai>=3.57.0",
    "openai-agents>=0.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "patsy>=1.0.3",
    "pyparsing>=3.3.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "quandl>=3.7.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "setuptools>=83.0.0",
    "six>=1.17.0",
    "statsmodels>=0.15.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "urllib3>=2.7.0",
]

[project.scripts]
llm-course = "llm_course:main"

[build-system]
